name: Build FreeFire Hack APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android NDK (Older Version for compatibility)
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620"
        
    - name: Download Dependencies & Patch
      run: |
        mkdir -p app/src/main/cpp/imgui
        wget https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.tar.gz
        tar -xzf v1.89.9.tar.gz
        cp -r imgui-1.89.9/* app/src/main/cpp/imgui/
        
        # Dobby ലൈബ്രറി ക്ലോൺ ചെയ്യുന്നു
        git clone --depth 1 https://github.com/jmpews/Dobby.git app/src/main/cpp/dobby
        
        # 1. Dobby-യുടെ assembly കോഡിലെ iOS-ന് വേണ്ടിയുള്ള @PAGE, @PAGEOFF ഒഴിവാക്കുന്നു
        find app/src/main/cpp/dobby -name "*.asm" -type f -exec sed -i 's/@PAGE//g' {} +
        find app/src/main/cpp/dobby -name "*.asm" -type f -exec sed -i 's/@PAGEOFF//g' {} +
        
        # 2. മുൻപ് വന്ന load_address എറർ ഫിക്സ് ചെയ്യുന്നു
        sed -i 's/load_address/base/g' app/src/main/cpp/dobby/source/Backend/UserMode/PlatformUtil/Linux/ProcessRuntime.cc
        
    - name: Update build.gradle for NDK 23
      run: |
        sed -i 's/ndkVersion "25.2.9519653"/ndkVersion "23.1.7779620"/g' app/build.gradle
        
    - name: Generate Gradle Wrapper (v8.2)
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        ./gradle-8.2/bin/gradle wrapper
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleDebug
      
    - uses: actions/upload-artifact@v4
      with:
        name: FreeFire-Hack
        path: app/build/outputs/apk/debug/app-debug.apk
