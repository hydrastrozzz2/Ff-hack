name: Build FreeFire Hack APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: android-actions/setup-android@v2
    - name: Download Dependencies
      run: |
        mkdir -p app/src/main/cpp/imgui
        mkdir -p app/src/main/cpp/dobby
        mkdir -p app/libs/arm64-v8a
        wget https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.tar.gz
        tar -xzf v1.89.9.tar.gz
        cp -r imgui-1.89.9/* app/src/main/cpp/imgui/
        wget https://github.com/jmpews/Dobby/releases/download/v1.0.0/dobby-android-arm64.so
        mv dobby-android-arm64.so app/libs/arm64-v8a/libdobby.so
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APK
      run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v3
      with:
        name: FreeFire-Hack
        path: app/build/outputs/apk/debug/app-debug.apk
