name: Build FreeFire Hack APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620"
        
    - name: Download Dependencies & Patch Dobby
      run: |
        mkdir -p app/src/main/cpp/imgui
        wget https://github.com/ocornut/imgui/archive/refs/tags/v1.89.9.tar.gz
        tar -xzf v1.89.9.tar.gz
        cp -r imgui-1.89.9/* app/src/main/cpp/imgui/
        
        git clone --depth 1 https://github.com/jmpews/Dobby.git app/src/main/cpp/dobby
        
        # Dobby-യുടെ അസംബ്ലി ഫയൽ കൃത്യമായി തിരുത്തുന്നു
        ASM_FILE="app/src/main/cpp/dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
        
        sed -i 's/@PAGEOFF/:lo12:/g' $ASM_FILE
        sed -i 's/@PAGE//g' $ASM_FILE
        
        # ഫയൽ ശരിയായി മാറിയോ എന്ന് ലോഗിൽ കാണാൻ
        echo "=== Patched Assembly File Lines ==="
        grep -n "common_closure_bridge_handler" $ASM_FILE
        echo "==================================="
        
        # load_address -> base ഫിക്സ്
        sed -i 's/load_address/base/g' app/src/main/cpp/dobby/source/Backend/UserMode/PlatformUtil/Linux/ProcessRuntime.cc
        
    - name: Update build.gradle for NDK 23
      run: |
        sed -i 's/ndkVersion "25.2.9519653"/ndkVersion "23.1.7779620"/g' app/build.gradle
        
    - name: Generate Gradle Wrapper (v8.2)
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        ./gradle-8.2/bin/gradle wrapper
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleDebug
      
    - uses: actions/upload-artifact@v4
      with:
        name: FreeFire-Hack
        path: app/build/outputs/apk/debug/app-debug.apk
